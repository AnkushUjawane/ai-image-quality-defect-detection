<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7a0" />
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#565e6b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="#0d0f12" />
  <rect x="0.5" y="0.5" width="1039" height="459" fill="none" stroke="#262b33" />

  <!-- title -->
  <text x="30" y="38" fill="#8b93a1" font-size="12" letter-spacing="2">APERTURE — REQUEST / INFERENCE FLOW</text>
  <line x1="30" y1="50" x2="1010" y2="50" stroke="#262b33" />

  <!-- Frontend box -->
  <g>
    <rect x="30" y="150" width="200" height="140" rx="3" fill="#14171c" stroke="#3a4250" />
    <rect x="30" y="150" width="200" height="30" rx="3" fill="#191d23" stroke="#3a4250" />
    <text x="130" y="170" fill="#6ee7a0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FRONTEND</text>
    <text x="130" y="205" fill="#e8ebef" font-size="13" text-anchor="middle" font-weight="700">React + Vite</text>
    <text x="130" y="228" fill="#8b93a1" font-size="10.5" text-anchor="middle">Image upload,</text>
    <text x="130" y="244" fill="#8b93a1" font-size="10.5" text-anchor="middle">drag &amp; drop, preview</text>
    <text x="130" y="266" fill="#8b93a1" font-size="10.5" text-anchor="middle">Score / issues / history</text>
  </g>

  <!-- Backend box -->
  <g>
    <rect x="420" y="150" width="220" height="140" rx="3" fill="#14171c" stroke="#3a4250" />
    <rect x="420" y="150" width="220" height="30" rx="3" fill="#191d23" stroke="#3a4250" />
    <text x="530" y="170" fill="#6ee7a0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">FASTAPI BACKEND</text>
    <text x="530" y="205" fill="#e8ebef" font-size="13" text-anchor="middle" font-weight="700">REST API + SQLite</text>
    <text x="530" y="228" fill="#8b93a1" font-size="10.5" text-anchor="middle">Validation, routing,</text>
    <text x="530" y="244" fill="#8b93a1" font-size="10.5" text-anchor="middle">persistence, error handling</text>
    <text x="530" y="266" fill="#8b93a1" font-size="10.5" text-anchor="middle">/api/analyze · /api/analyses</text>
  </g>

  <!-- ML Pipeline box -->
  <g>
    <rect x="810" y="150" width="200" height="140" rx="3" fill="#14171c" stroke="#3a4250" />
    <rect x="810" y="150" width="200" height="30" rx="3" fill="#191d23" stroke="#3a4250" />
    <text x="910" y="170" fill="#6ee7a0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ML PIPELINE</text>
    <text x="910" y="205" fill="#e8ebef" font-size="13" text-anchor="middle" font-weight="700">OpenCV + RandomForest</text>
    <text x="910" y="228" fill="#8b93a1" font-size="10.5" text-anchor="middle">13 engineered features</text>
    <text x="910" y="244" fill="#8b93a1" font-size="10.5" text-anchor="middle">5 per-issue classifiers</text>
    <text x="910" y="266" fill="#8b93a1" font-size="10.5" text-anchor="middle">Severity + explanation</text>
  </g>

  <!-- Forward arrows (top row) -->
  <line x1="230" y1="185" x2="415" y2="185" stroke="#6ee7a0" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="322" y="175" fill="#8b93a1" font-size="10" text-anchor="middle">multipart/form-data</text>

  <line x1="640" y1="185" x2="805" y2="185" stroke="#6ee7a0" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="722" y="175" fill="#8b93a1" font-size="10" text-anchor="middle">feature vector</text>

  <!-- Return arrows (bottom row) -->
  <line x1="805" y1="255" x2="640" y2="255" stroke="#565e6b" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <text x="722" y="270" fill="#8b93a1" font-size="10" text-anchor="middle">predictions</text>

  <line x1="415" y1="255" x2="230" y2="255" stroke="#565e6b" stroke-width="1.5" marker-end="url(#arrowDim)" />
  <text x="322" y="270" fill="#8b93a1" font-size="10" text-anchor="middle">JSON quality report</text>

  <!-- SQLite note under backend -->
  <g>
    <rect x="460" y="330" width="140" height="46" rx="3" fill="#191d23" stroke="#262b33" />
    <text x="530" y="349" fill="#f0b45c" font-size="10.5" text-anchor="middle" font-weight="700">SQLite</text>
    <text x="530" y="364" fill="#8b93a1" font-size="9.5" text-anchor="middle">analyses + image copies</text>
    <line x1="530" y1="290" x2="530" y2="330" stroke="#262b33" stroke-width="1.5" marker-end="url(#arrowDim)" />
  </g>

  <!-- model.joblib note under ML pipeline -->
  <g>
    <rect x="850" y="330" width="120" height="46" rx="3" fill="#191d23" stroke="#262b33" />
    <text x="910" y="349" fill="#f0b45c" font-size="10.5" text-anchor="middle" font-weight="700">model.joblib</text>
    <text x="910" y="364" fill="#8b93a1" font-size="9.5" text-anchor="middle">loaded once, cached</text>
    <line x1="910" y1="290" x2="910" y2="330" stroke="#262b33" stroke-width="1.5" marker-end="url(#arrowDim)" />
  </g>

  <!-- legend -->
  <line x1="30" y1="410" x2="70" y2="410" stroke="#6ee7a0" stroke-width="1.5" />
  <text x="78" y="414" fill="#8b93a1" font-size="10">request path</text>
  <line x1="220" y1="410" x2="260" y2="410" stroke="#565e6b" stroke-width="1.5" />
  <text x="268" y="414" fill="#8b93a1" font-size="10">response path</text>
</svg>